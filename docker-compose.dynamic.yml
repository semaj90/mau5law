services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres-dynamic
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=123456
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5434:5432"  # Use same port as your existing setup
    volumes:
      - postgres_data_dynamic:/var/lib/postgresql/data
      - ./legal_ai_db_backup.sql:/docker-entrypoint-initdb.d/restore.sql
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis/redis-stack:latest
    container_name: legal-ai-redis-dynamic
    ports:
      - "6379:6379"   # Standard Redis port
      - "8001:8001"   # Standard RedisInsight port
    command: >
      bash -c "
      redis-server --requirepass 'redis' --appendonly yes --port 6379 &
      redis-stack-server --port 8001 --requirepass 'redis' &
      wait
      "
    volumes:
      - redis_data_dynamic:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio-dynamic
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"  # Standard MinIO API port
      - "9001:9001"  # Standard MinIO Console port
    volumes:
      - minio_data_dynamic:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  frontend:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.dev
    container_name: legal-ai-frontend-dynamic
    ports:
      - "5173:5173"  # Vite dev server port
    volumes:
      - ./sveltekit-frontend:/app
      - /app/node_modules  # Anonymous volume to prevent host node_modules override
    networks:
      - legal-ai-network
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - ENABLE_GPU=true
      - RTX_3060_OPTIMIZATION=true
      - CONTEXT7_MULTICORE=true
      - OLLAMA_GPU_LAYERS=30
      - QUIC_ENABLED=true
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: legal-ai-caddy-dynamic
    ports:
      - "443:443"   # Standard HTTPS port
      - "80:80"     # Standard HTTP port
    volumes:
      - ./sveltekit-frontend/Caddyfile.dynamic:/etc/caddy/Caddyfile
      - caddy_data_dynamic:/data
      - caddy_config_dynamic:/config
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
      - frontend
    restart: unless-stopped

volumes:
  postgres_data_dynamic:
  redis_data_dynamic:
  minio_data_dynamic:
  caddy_data_dynamic:
  caddy_config_dynamic:

networks:
  legal-ai-network:
    external: true