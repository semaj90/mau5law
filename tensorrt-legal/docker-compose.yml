version: '3.8'

services:
  tensorrt-legal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-tensorrt-service
    ports:
      - "8100:8100"
    volumes:
      - ./models:/app/models
      - ./cache:/app/cache
      - ./logs:/app/logs
    environment:
      - PORT=8100
      - MODEL_PATH=/app/models/gemma3-legal-q4km.onnx
      - PLAN_PATH=/app/cache/gemma3-legal-q4km.plan
      - LOG_LEVEL=info
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Integration with existing legal AI platform
  tensorrt-proxy:
    image: nginx:alpine
    container_name: tensorrt-proxy
    ports:
      - "8101:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - tensorrt-legal
    restart: unless-stopped

  # Monitoring and metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: tensorrt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - tensorrt-legal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: tensorrt-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:

networks:
  default:
    name: legal-ai-network
    external: true