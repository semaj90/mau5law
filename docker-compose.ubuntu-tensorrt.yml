# Ubuntu WSL2 TensorRT-LLM Docker Compose
# Optimized for CUDA 13.0 and Python 3.12

version: '3.8'

services:
  tensorrt-legal-ubuntu:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu-tensorrt
    container_name: tensorrt-legal-ubuntu
    ports:
      - "8100:8100"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONPATH=/app
    volumes:
      - type: bind
        source: .
        target: /app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    stdin_open: true
    tty: true