services:
  # === SVELTEKIT FRONTEND ===
  sveltekit-frontend:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.sveltekit
      target: development
    container_name: legal-ai-sveltekit
    ports:
      - "5174:5174"
      - "24678:24678"  # HMR WebSocket
    volumes:
      - ./sveltekit-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5174
      - ORIGIN=http://localhost:5174
      - DATABASE_URL=postgresql://legal_admin:123456@postgres-pgvector-gpu:5432/legal_ai_db
      - REDIS_PASSWORD=redis
      - REDIS_URL=redis://:redis@redis:6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - legal-ai-network
    restart: unless-stopped

  # === CADDY WITH QUIC ===
  caddy-quic:
    image: caddy:alpine
    container_name: legal-ai-caddy-quic
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - legal-ai-network
    restart: unless-stopped

networks:
  legal-ai-network:
    external: true