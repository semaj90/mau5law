version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-postgres-384
    environment:
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: legal_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-384:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qdrant-384
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data-384:/qdrant/storage
    environment:
      QDRANT_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legal-redis-384
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis
    volumes:
      - redis-data-384:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-384:
  qdrant-data-384:
  redis-data-384:
