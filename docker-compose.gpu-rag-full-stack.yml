version: '3.8'

# GPU-Accelerated Legal AI RAG Stack
# TensorRT-LLM + Qdrant + Redis-Stack + EmbeddingGemma + LangExtract
# WebGPU + SIMD + Auto-Encoder Pipeline

services:
  #########################################
  # Vector Database - Qdrant
  #########################################
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  #########################################
  # Cache & Search - Redis Stack
  #########################################
  redis:
    image: redis/redis-stack:latest
    container_name: legal-ai-redis
    ports:
      - "6379:6379"  # Redis
      - "8001:8001"  # RedisInsight
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--requirepass redis --maxmemory 2gb --maxmemory-policy allkeys-lru
    command: >
      redis-stack-server
      --requirepass redis
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  #########################################
  # PostgreSQL + pgvector
  #########################################
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=123456
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  #########################################
  # Ollama GPU Inference Engine
  #########################################
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 30s
      retries: 5

  #########################################
  # Embedding Service - EmbeddingGemma
  #########################################
  embedding-service:
    image: ollama/ollama:latest
    container_name: legal-ai-embedding
    ports:
      - "11435:11434"
    volumes:
      - embedding_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - legal-ai-network
    command: >
      sh -c "ollama serve & sleep 10 && 
             ollama pull nomic-embed-text && 
             ollama pull all-minilm && 
             tail -f /dev/null"

  #########################################
  # TensorRT-LLM Inference Server
  #########################################
  tensorrt-inference:
    image: nvcr.io/nvidia/tensorrt:24.01-py3
    container_name: legal-ai-tensorrt
    ports:
      - "8000:8000"  # HTTP
      - "8001:8001"  # gRPC
      - "8002:8002"  # Metrics
    volumes:
      - ./engines:/engines
      - ./models:/models
      - tensorrt_cache:/tensorrt_cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TENSORRT_LOG_LEVEL=INFO
      - MODEL_NAME=gemma3-legal
      - MODEL_PATH=/engines/gemma3-legal.engine
      - MAX_BATCH_SIZE=8
      - MAX_INPUT_LEN=4096
      - MAX_OUTPUT_LEN=2048
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - legal-ai-network
    command: >
      python -m tensorrt_llm.hlapi.llm_api
      --model_dir /engines
      --engine_dir /engines
      --host 0.0.0.0
      --port 8000

  #########################################
  # LangExtract Web Scraping + RAG Service
  #########################################
  langextract:
    build:
      context: ./langextract-go
      dockerfile: Dockerfile
    container_name: legal-ai-langextract
    ports:
      - "8090:8090"
    volumes:
      - ./langextract-go:/app
      - langextract_cache:/cache
    environment:
      - REDIS_URL=redis://:redis@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - EMBEDDING_URL=http://embedding-service:11434
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - LOG_LEVEL=info
      - CACHE_TTL=3600
      - MAX_WORKERS=4
    depends_on:
      - redis
      - qdrant
      - postgres
      - ollama
      - embedding-service
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  #########################################
  # FastAPI Embedding Service (Python)
  #########################################
  fastapi-embed:
    build:
      context: ./python-services/embedding-api
      dockerfile: Dockerfile
    container_name: legal-ai-fastapi-embed
    ports:
      - "8003:8000"
    volumes:
      - ./python-services/embedding-api:/app
      - embedding_cache:/cache
    environment:
      - REDIS_URL=redis://:redis@redis:6379/1
      - MODEL_NAME=nomic-embed-text
      - BATCH_SIZE=32
      - DEVICE=cuda
      - CACHE_EMBEDDINGS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - legal-ai-network

  #########################################
  # RAG Orchestrator (Python + LangChain)
  #########################################
  rag-orchestrator:
    build:
      context: ./python-services/rag-orchestrator
      dockerfile: Dockerfile
    container_name: legal-ai-rag-orchestrator
    ports:
      - "8004:8000"
    volumes:
      - ./python-services/rag-orchestrator:/app
      - rag_cache:/cache
    environment:
      - REDIS_URL=redis://:redis@redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - LLM_URL=http://tensorrt-inference:8000
      - EMBEDDING_URL=http://fastapi-embed:8000
      - LANGEXTRACT_URL=http://langextract:8090
      - COLLECTION_NAME=legal_documents
      - TOP_K=10
      - SIMILARITY_THRESHOLD=0.7
      - ENABLE_RERANKING=true
      - ENABLE_WEB_SEARCH=true
    depends_on:
      - redis
      - qdrant
      - postgres
      - tensorrt-inference
      - fastapi-embed
      - langextract
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  #########################################
  # Neo4j Knowledge Graph
  #########################################
  neo4j:
    image: neo4j:5.15-community
    container_name: legal-ai-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/legal123456
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "legal123456", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  #########################################
  # RabbitMQ Message Queue
  #########################################
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=legal_admin
      - RABBITMQ_DEFAULT_PASS=123456
      - RABBITMQ_DEFAULT_VHOST=/
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  #########################################
  # MinIO Object Storage
  #########################################
  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  #########################################
  # SvelteKit Frontend
  #########################################
  sveltekit:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.dev
    container_name: legal-ai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./sveltekit-frontend:/app
      - /app/node_modules
      - sveltekit_cache:/app/.svelte-kit
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://localhost:8004
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legal123456
      - RABBITMQ_URL=amqp://legal_admin:123456@rabbitmq:5672
    depends_on:
      - postgres
      - redis
      - qdrant
      - ollama
      - rag-orchestrator
      - minio
      - neo4j
      - rabbitmq
    restart: unless-stopped
    networks:
      - legal-ai-network
    command: npm run dev -- --host 0.0.0.0

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  qdrant_storage:
  redis_data:
  postgres_data:
  ollama_models:
  embedding_models:
  tensorrt_cache:
  langextract_cache:
  embedding_cache:
  rag_cache:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
  minio_data:
  sveltekit_cache:
