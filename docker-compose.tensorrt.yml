version: '3.8'

services:
  tensorrt-legal-ubuntu:
    build:
      context: .
      dockerfile: Dockerfile.cached-nvidia
      cache_from:
        - nvcr.io/nvidia/pytorch:24.12-py3
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: tensorrt-legal-ubuntu:latest
    container_name: tensorrt-legal-ubuntu
    ports:
      - "8100:8100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - TORCH_CUDA_ARCH_LIST=8.6  # RTX 3060 Ti Ampere
      - LEGAL_AI_MODE=production
      - TENSORRT_OPTIMIZATION=1
    volumes:
      # Mount for model persistence
      - ./models:/app/models:rw
      # Mount for logs
      - ./logs:/app/logs:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - legal-ai

networks:
  legal-ai:
    driver: bridge
    name: legal-ai-network