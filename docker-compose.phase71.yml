version: '3.8'

services:
  # PostgreSQL with pgvector for vector storage
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and session management
  redis:
    image: redis:7.4-alpine
    container_name: legal-ai-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO for object storage
  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: legal-ai-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - legal-ai-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - legal-ai-network
    environment:
      - OLLAMA_GPU_LAYERS=25
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_MAX_QUEUE=512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # TensorRT-LLM service for optimized inference
  tensorrt-llm-service:
    build:
      context: ./python-services
      dockerfile: Dockerfile.tensorrt
    container_name: legal-ai-tensorrt-llm
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_USE_CUDA_DSA=1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    volumes:
      - tensorrt_engines:/app/tensorrt_engines
      - tensorrt_models:/app/models
      - tensorrt_tokenizers:/app/tokenizers
    ports:
      - "8099:8099"
    networks:
      - legal-ai-network
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 60s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Go microservice for SIMD operations
  go-microservice:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile
    container_name: legal-ai-go-microservice
    environment:
      - REDIS_URL=redis://:redis@redis:6379
      - POSTGRES_URL=postgresql://postgres:123456@postgres:5432/legal_ai_db
      - OLLAMA_URL=http://ollama:11434
      - TENSORRT_URL=http://tensorrt-llm-service:8099
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - go_cache:/go/pkg
    ports:
      - "8097:8097"
      - "8093:8093"
    networks:
      - legal-ai-network
    depends_on:
      - redis
      - postgres
      - ollama
      - tensorrt-llm-service
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python services for document processing
  python-services:
    build:
      context: ./python-services
      dockerfile: Dockerfile
    container_name: legal-ai-python-services
    environment:
      - REDIS_URL=redis://:redis@redis:6379
      - POSTGRES_URL=postgresql://postgres:123456@postgres:5432/legal_ai_db
      - OLLAMA_URL=http://ollama:11434
      - TENSORRT_URL=http://tensorrt-llm-service:8099
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - python_cache:/root/.cache/pip
    ports:
      - "8092:8092"
      - "8094:8094"
    networks:
      - legal-ai-network
    depends_on:
      - redis
      - postgres
      - ollama
      - tensorrt-llm-service
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8092/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SvelteKit frontend
  sveltekit-frontend:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile
    container_name: legal-ai-frontend
    environment:
      - DATABASE_URL=postgresql://postgres:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis:6379
      - PUBLIC_OLLAMA_URL=http://localhost:11434
      - PUBLIC_TENSORRT_URL=http://localhost:8099
      - PUBLIC_GO_SERVICE_URL=http://localhost:8097
      - PUBLIC_PYTHON_SERVICE_URL=http://localhost:8092
      - PUBLIC_MINIO_URL=http://localhost:9000
    ports:
      - "3000:3000"
      - "5173:5173"
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
      - ollama
      - tensorrt-llm-service
      - go-microservice
      - python-services
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: legal-ai-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - legal-ai-network
    depends_on:
      - sveltekit-frontend
      - tensorrt-llm-service
      - go-microservice
      - python-services
    restart: unless-stopped

  # Monitoring stack (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: legal-ai-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - legal-ai-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: legal-ai-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - legal-ai-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  tensorrt_engines:
  tensorrt_models:
  tensorrt_tokenizers:
  go_cache:
  python_cache:
  prometheus_data:
  grafana_data:
  qdrant_data: