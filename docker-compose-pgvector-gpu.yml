version: '3.8'

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg17
    container_name: postgres-pgvector-gpu
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    ports:
      - "5432:5432"  # Standard PostgreSQL port
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      postgres
      -c shared_preload_libraries='vector'
      -c vector.max_parallel_workers=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c effective_io_concurrency=200
      -c random_page_cost=1.1
      -c effective_cache_size=4GB
      -c maintenance_work_mem=256MB
      -c work_mem=32MB
      -c shared_buffers=1GB
      -c wal_buffers=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  ollama-gemma:
    image: ollama/ollama:latest
    container_name: ollama-gemma-gpu
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "11436:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  cuda-service:
    build:
      context: .
      dockerfile: Dockerfile.cuda-service
    container_name: cuda-pgvector-service
    restart: unless-stopped
    runtime: nvidia
    environment:
      - DATABASE_URL=postgres://legal_admin:123456@postgres-pgvector:5432/legal_ai_db?sslmode=disable
      - OLLAMA_URL=http://ollama-gemma:11434
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PORT=8097
    ports:
      - "8097:8097"
    depends_on:
      postgres-pgvector:
        condition: service_healthy
      ollama-gemma:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgvector_data:
  ollama_data:

networks:
  default:
    name: pgvector-gpu-network
    driver: bridge