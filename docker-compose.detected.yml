version: '3.8'
services:
  neo4j:
    image: neo4j:5-community
    command: neo4j
    entrypoint: tini -g -- /startup/docker-entrypoint.sh
    environment:
      # Do NOT hard-code credentials in compose. Use .env or host env vars.
      # Example: export NEO4J_AUTH=neo4j/strongpassword
      NEO4J_AUTH: "${NEO4J_AUTH}"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "1G"
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,gds.*'
      LANG: "C.UTF-8"
    # Uncomment to expose host ports if needed (watch for collisions)
    # ports:
    #   - "7474:7474"   # HTTP
    #   - "7687:7687"   # Bolt
    volumes:
      - deeds-web-app_neo4j-data-384:/data
      - deeds-web-app_neo4j-logs-384:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7474/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      com.deeds.service: 'neo4j'

volumes:
  deeds-web-app_neo4j-logs-384: {}
  deeds-web-app_neo4j-data-384: {}
