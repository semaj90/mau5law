name: CI

on:
  push:
    paths:
      - 'agentic-ai-rag/**'
  pull_request:
    paths:
      - 'agentic-ai-rag/**'

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai-rag/backend/node-api
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci
      - name: Run TypeScript check
        run: npx tsc --noEmit || true
      - name: Run lint (if available)
        run: |
          if [ -f package.json ]; then
            npm run lint --silent || true
          fi

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai-rag/ml-services/embedding_worker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Run pytest
        run: |
          if [ -f pytest.ini ] || ls tests 1>/dev/null 2>&1; then
            pytest -q || true
          else
            echo "No python tests detected"
          fi
