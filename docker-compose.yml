# NOTE: The top-level `services:` block was consolidated into a single section
# later in this file. The original duplicated block was removed to prevent
# "mapping key 'services' already defined" YAML errors when parsing.

x-phaseh-bridge-build: &phaseh-bridge-build
  context: .
  dockerfile: native/autoencoder/Dockerfile.bridge

services:
  # SvelteKit Frontend Service - Main
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-ai-frontend
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    ports:
      # Main SvelteKit ports
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
      - "5176:5176"
      - "5177:5177"
      - "5178:5178"
      - "5179:5179"
      # HMR WebSocket ports (original + 1000)
      - "6173:6173"
      - "6174:6174"
      - "6175:6175"
      - "6176:6176"
      - "6177:6177"
      - "6178:6178"
      - "6179:6179"
      # Custom WebSocket ports (original + 2000)
      - "7173:7173"
      - "7174:7174"
      - "7175:7175"
      - "7176:7176"
      - "7177:7177"
      - "7178:7178"
      - "7179:7179"
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://localhost:8080
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://host.docker.internal:11434
      # Use localhost so URLs embedded in the browser client resolve correctly outside Docker
      - MINIO_ENDPOINT=http://localhost:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=legal-documents
      - RABBITMQ_URL=amqp://legal_admin:secret123@rabbitmq:5672
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./svelte.config.js:/app/svelte.config.js
      - ./vite.config.js:/app/vite.config.js
    depends_on:
      - postgres
      - redis
    networks:
      - legal-ai-network

  # Caddy Reverse Proxy
  caddy:
    image: caddy:latest
    container_name: legal-ai-caddy
    ports:
      - "443:443/tcp"    # HTTPS
      - "443:443/udp"    # QUIC/HTTP3
      - "80:80/tcp"      # HTTP redirect
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./Caddyfile.ws:/etc/caddy/Caddyfile.ws
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - legal-ai-network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=123456
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"  # Map to 5432 to match user requirements
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init/00-init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis/redis-stack:latest
    container_name: legal-ai-redis
    ports:
      - "6379:6379"   # Redis port
      - "18001:8001"   # RedisInsight port (shifted to avoid analytics bridge port)
    command: >
      redis-server
      --appendonly yes
      --port 6379
      --protected-mode no
      --bind 0.0.0.0
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/redistimeseries.so
      --loadmodule /opt/redis-stack/lib/rejson.so
      --loadmodule /opt/redis-stack/lib/redisbloom.so
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=legal_admin
      - RABBITMQ_DEFAULT_PASS=secret123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Qdrant vector database for advanced vector operations
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-ai-network
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI embedding service
  fastapi-embed:
    build:
      context: ./python-workers/fastapi-embed
      dockerfile: Dockerfile
    container_name: legal-ai-fastapi-embed
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/cache
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    volumes:
      - fastapi_cache:/app/cache
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis

  analytics-bridge:
    build:
      <<: *phaseh-bridge-build
    container_name: phase-h-analytics-bridge
    command: ["uvicorn", "native.autoencoder.analytics_bridge:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USER_ANALYTICS_STREAM=user.analytics
      - USER_INTENT_HASH_NAMESPACE=user:intent
      - RL_FEEDBACK_STREAM=rl.feedback
      - TRITON_URL=http://triton:8000
      - PG_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - PG_INTENT_TABLE=user_intent_transitions
      - PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      triton:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh analytics-bridge"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cpu-synthesizer:
    build:
      <<: *phaseh-bridge-build
    container_name: phase-h-cpu-synthesizer
    command: ["uvicorn", "native.autoencoder.cpu_synthesizer:app", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CPU_SYNTH_MAX_TOKENS=256
    ports:
      - "8101:8101"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh http http://127.0.0.1:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  behavior-router:
    build:
      <<: *phaseh-bridge-build
    container_name: phase-h-behavior-router
    command: ["python", "-m", "native.autoencoder.behavior_router"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USER_ANALYTICS_STREAM=user.analytics
      - USER_INTENT_HASH_NAMESPACE=user:intent
      - RL_FEEDBACK_STREAM=rl.feedback
      - PG_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - PG_INTENT_TABLE=user_intent_transitions
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      analytics-bridge:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh redis"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qlora-trainer:
    build:
      <<: *phaseh-bridge-build
    container_name: phase-h-qlora-trainer
    command: ["python", "-m", "native.autoencoder.qlora_trainer_stream"]
    runtime: nvidia
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RL_FEEDBACK_STREAM=rl.feedback
      - TRITON_URL=http://triton:8000
      - ADAPTER_ARTIFACT_DIR=/app/native/autoencoder/artifacts
      - TRITON_MODEL_NAME=gemma3_legal
      - QLORA_BASE_MODEL=google/gemma-2b-it
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
      - ./native/autoencoder/triton_model_repository:/models:ro
    depends_on:
      redis:
        condition: service_healthy
      triton:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh redis"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  adapter-merge-worker:
    build:
      <<: *phaseh-bridge-build
    container_name: phase-h-adapter-merge-worker
    command: ["python", "-m", "native.autoencoder.adapter_merge_worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TRITON_URL=http://triton:8000
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
      - ./native/autoencoder/triton_model_repository:/models
    depends_on:
      redis:
        condition: service_healthy
      qlora-trainer:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh redis"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  tensorrt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: legal-ai-tensorrt-llm
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_HUB_CACHE=/workspace/cache
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis:6379/0
      - REDIS_PASSWORD=redis
    ports:
      - "${TENSORRT_HTTP_PORT:-8096}:8096"
      - "${TENSORRT_WS_PORT:-8097}:8097"
      - "${TENSORRT_HEALTH_PORT:-8098}:8098"
    volumes:
      - ${TENSORRT_MODEL_DIR:-./docker/tensorrt-llm/models}:/workspace/models
      - ${TENSORRT_ENGINE_DIR:-./docker/tensorrt-llm/engines}:/workspace/engines
      - ${TENSORRT_CACHE_DIR:-./.cache/tensorrt-llm}:/workspace/cache
    command:
      - bash
      - -lc
      - |
        set -e
        echo 'Starting TensorRT-LLM server...'
        python3 -m tensorrt_llm.hlapi.llm_server \
          --host 0.0.0.0 \
          --port 8096 \
          --model ${TENSORRT_PRIMARY_MODEL:-/workspace/models} \
          --tensorrt_llm_model_path /workspace/engines \
          --max_batch_size ${TENSORRT_MAX_BATCH:-2} \
          --max_input_len ${TENSORRT_MAX_INPUT:-2048} \
          --max_output_len ${TENSORRT_MAX_OUTPUT:-1024}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8098/health || curl -f http://localhost:8096/health
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_started
    networks:
      - legal-ai-network
    restart: unless-stopped

  triton:
    image: nvcr.io/nvidia/tritonserver:23.09-py3
    container_name: phase-h-triton
    shm_size: 1g
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=0"]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
      - "8002:8002"
    volumes:
      - ./native/autoencoder/triton_model_repository:/models
      - ./native/autoencoder/artifacts:/adapters
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # QUIC Server for high-performance protocols
  quic-server:
    build:
      context: .
      dockerfile: Dockerfile.quic
    container_name: legal-ai-quic
    ports:
      - "4433:4433/udp"
      - "4434:4434/udp"
      - "8095:8095"
    environment:
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis:6379/0
      - REDIS_PASSWORD=redis
      - QUIC_PORT=4433
      - OLLAMA_URL=http://host.docker.internal:11434
      - ENABLE_GPU=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=legal-documents
    volumes:
      - ./go-services:/app/services
      - ./protobuf:/app/protobuf
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Neo4j graph database
  neo4j:
    image: neo4j:5-community
    container_name: legal-ai-neo4j
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j123", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  qdrant_data:
    driver: local
  fastapi_cache:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  legal-ai-network:
    driver: bridge
