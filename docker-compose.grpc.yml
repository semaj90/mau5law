version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai-network

  # Search Service (gRPC)
  search-service:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile.search
    container_name: legal-ai-search
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://legal_admin:secure_password_123@postgres:5432/legal_ai_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "search_service.SearchService/Health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Timeline Service (gRPC)
  timeline-service:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile.timeline
    container_name: legal-ai-timeline
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: postgres://legal_admin:secure_password_123@postgres:5432/legal_ai_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50052", "timeline_service.TimelineService/Health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics Service (gRPC)
  analytics-service:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile.analytics
    container_name: legal-ai-analytics
    ports:
      - "50053:50053"
    environment:
      DATABASE_URL: postgres://legal_admin:secure_password_123@postgres:5432/legal_ai_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50053", "analytics_service.AnalyticsService/Health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTP → gRPC Gateway
  http-gateway:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile.gateway
    container_name: legal-ai-gateway
    ports:
      - "8080:8080"
    environment:
      SEARCH_SERVICE: search-service:50051
      TIMELINE_SERVICE: timeline-service:50052
      ANALYTICS_SERVICE: analytics-service:50053
      PORT: "8080"
    depends_on:
      - search-service
      - timeline-service
      - analytics-service
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  legal-ai-network:
    driver: bridge
