version: '3.8'

# Complete Legal AI Stack - 384-Dimension Vector Search
# Includes: PostgreSQL, Qdrant, Redis, RabbitMQ, Neo4j, MinIO

services:
  # ============================================================================
  # Database Services
  # ============================================================================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-postgres-384
    environment:
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: legal_ai_db
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-384:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai-network

  # ============================================================================
  # Vector Search Services
  # ============================================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qdrant-384
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data-384:/qdrant/storage
    environment:
      QDRANT_HOST: 0.0.0.0
      QDRANT_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai-network

  # ============================================================================
  # Cache Services
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: legal-redis-384
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-384:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai-network

  # ============================================================================
  # Message Queue
  # ============================================================================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-rabbitmq-384
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data-384:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - legal-ai-network

  # ============================================================================
  # Graph Database
  # ============================================================================

  neo4j:
    image: neo4j:5-community
    container_name: legal-neo4j-384
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data-384:/data
      - neo4j-logs-384:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - legal-ai-network

  # ============================================================================
  # Object Storage
  # ============================================================================

  minio:
    image: minio/minio:latest
    container_name: legal-minio-384
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data-384:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - legal-ai-network

# ============================================================================
# Volumes
# ============================================================================

volumes:
  postgres-data-384:
    driver: local
  qdrant-data-384:
    driver: local
  redis-data-384:
    driver: local
  rabbitmq-data-384:
    driver: local
  neo4j-data-384:
    driver: local
  neo4j-logs-384:
    driver: local
  minio-data-384:
    driver: local

# ============================================================================
# Networks
# ============================================================================

networks:
  legal-ai-network:
    driver: bridge
