version: '3.8'

services:
  # Neo4j Graph Database for AST and error relationships
  neo4j:
    image: neo4j:5.23-community
    container_name: phase72-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'gds.*,apoc.*'
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./phase72/go-service/schema.cypher:/var/lib/neo4j/import/schema.cypher:ro
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - phase72-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Go service for Neo4j operations and graph management
  phase72-go-service:
    build:
      context: ./phase72/go-service
      dockerfile: Dockerfile
    container_name: phase72-go-service
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://:redis@redis:6379
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8072:8072"
    networks:
      - phase72-network
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8072/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python service for CUDA embeddings and clustering
  phase72-python-service:
    build:
      context: ./phase72/python-service
      dockerfile: Dockerfile
    container_name: phase72-python-service
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://:redis@redis:6379
      - QDRANT_URL=http://qdrant:6333
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_USE_CUDA_DSA=1
    volumes:
      - python_cache:/root/.cache/pip
    ports:
      - "8073:8073"
    networks:
      - phase72-network
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8073/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Node.js service for AI patch generation
  phase72-node-service:
    build:
      context: ./phase72/node-service
      dockerfile: Dockerfile
    container_name: phase72-node-service
    environment:
      - NEO4J_ENDPOINT=http://phase72-go-service:8072
      - EMBEDDER_ENDPOINT=http://phase72-python-service:8073
      - OLLAMA_ENDPOINT=http://ollama:11434
      - REDIS_URL=redis://:redis@redis:6379
    volumes:
      - ./sveltekit-frontend:/app/sveltekit-frontend:ro
      - node_cache:/app/node_modules
    ports:
      - "8074:8074"
    networks:
      - phase72-network
    depends_on:
      phase72-go-service:
        condition: service_healthy
      phase72-python-service:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8074/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching embeddings and error data
  redis:
    image: redis:7.4-alpine
    container_name: phase72-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - phase72-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant for vector similarity search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: phase72-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - phase72-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for AI patch generation
  ollama:
    image: ollama/ollama:latest
    container_name: phase72-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - phase72-network
    environment:
      - OLLAMA_GPU_LAYERS=25
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Phase 72 Dashboard (optional monitoring interface)
  phase72-dashboard:
    build:
      context: ./phase72/dashboard
      dockerfile: Dockerfile
    container_name: phase72-dashboard
    environment:
      - NEO4J_ENDPOINT=http://phase72-go-service:8072
      - NODE_SERVICE_ENDPOINT=http://phase72-node-service:8074
      - PYTHON_SERVICE_ENDPOINT=http://phase72-python-service:8073
    ports:
      - "8075:8075"
    networks:
      - phase72-network
    depends_on:
      - phase72-go-service
      - phase72-node-service
      - phase72-python-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8075/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  phase72-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
  ollama_data:
  python_cache:
  node_cache: