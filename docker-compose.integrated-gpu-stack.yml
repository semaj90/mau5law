version: '3.9'

# INTEGRATED GPU-Accelerated Legal AI Stack
# Consolidates: Existing services + TensorRT + Auto-encoder + RAG
# Based on your current infrastructure with optimizations

x-common-env: &common-env
  DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ""
  OLLAMA_URL: http://host.docker.internal:11434
  QDRANT_URL: http://qdrant:6333
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minio
  MINIO_SECRET_KEY: minio123
  MINIO_USE_SSL: "false"
  MINIO_BUCKET_NAME: legal-documents

x-gpu-service: &gpu-service
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  #########################################
  # Core Infrastructure (Your Existing)
  #########################################
  
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: "123456"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    container_name: legal-ai-redis
    ports:
      - "6379:6379"
      - "18001:8001"
    command: >
      redis-server
      --appendonly yes
      --port 6379
      --protected-mode no
      --bind 0.0.0.0
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/redistimeseries.so
      --loadmodule /opt/redis-stack/lib/rejson.so
      --loadmodule /opt/redis-stack/lib/redisbloom.so
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: legal_admin
      RABBITMQ_DEFAULT_PASS: "123456"
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  #########################################
  # Existing FastAPI Embedding Service
  #########################################
  
  fastapi-embed:
    build:
      context: ./python-workers/fastapi-embed
      dockerfile: Dockerfile
    container_name: legal-ai-fastapi-embed
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: "1"
      TRANSFORMERS_CACHE: /app/cache
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEFAULT_EMBEDDING_MODEL: embeddinggemma:latest
    volumes:
      - fastapi_cache:/app/cache
      - ./python-workers:/app
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    restart: unless-stopped

  #########################################
  # Phase H Auto-Encoder Pipeline (Existing)
  #########################################
  
  triton:
    image: nvcr.io/nvidia/tritonserver:23.09-py3
    container_name: phase-h-triton
    shm_size: 1g
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=0"]
    runtime: nvidia
    <<: *gpu-service
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    ports:
      - "8002:8000"  # Shifted to avoid fastapi-embed conflict
      - "8003:8002"  # Metrics
    volumes:
      - ./native/autoencoder/triton_model_repository:/models
      - ./native/autoencoder/artifacts:/adapters
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  analytics-bridge:
    build:
      context: .
      dockerfile: native/autoencoder/Dockerfile.bridge
    container_name: phase-h-analytics-bridge
    command: ["uvicorn", "native.autoencoder.analytics_bridge:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *common-env
      USER_ANALYTICS_STREAM: user.analytics
      USER_INTENT_HASH_NAMESPACE: user:intent
      RL_FEEDBACK_STREAM: rl.feedback
      TRITON_URL: http://triton:8000
      PG_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      PG_INTENT_TABLE: user_intent_transitions
      PORT: "8001"
    ports:
      - "8001:8001"
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      triton:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh analytics-bridge"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  cpu-synthesizer:
    build:
      context: .
      dockerfile: native/autoencoder/Dockerfile.bridge
    container_name: phase-h-cpu-synthesizer
    command: ["uvicorn", "native.autoencoder.cpu_synthesizer:app", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      <<: *common-env
      CPU_SYNTH_MAX_TOKENS: "256"
    ports:
      - "8101:8101"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh http http://127.0.0.1:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  behavior-router:
    build:
      context: .
      dockerfile: native/autoencoder/Dockerfile.bridge
    container_name: phase-h-behavior-router
    command: ["python", "-m", "native.autoencoder.behavior_router"]
    environment:
      <<: *common-env
      USER_ANALYTICS_STREAM: user.analytics
      USER_INTENT_HASH_NAMESPACE: user:intent
      RL_FEEDBACK_STREAM: rl.feedback
      PG_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      PG_INTENT_TABLE: user_intent_transitions
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      analytics-bridge:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh redis"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  qlora-trainer:
    build:
      context: .
      dockerfile: native/autoencoder/Dockerfile.bridge
    container_name: phase-h-qlora-trainer
    command: ["python", "-m", "native.autoencoder.qlora_trainer_stream"]
    runtime: nvidia
    <<: *gpu-service
    environment:
      <<: *common-env
      RL_FEEDBACK_STREAM: rl.feedback
      TRITON_URL: http://triton:8000
      ADAPTER_ARTIFACT_DIR: /app/native/autoencoder/artifacts
      TRITON_MODEL_NAME: gemma3_legal
      QLORA_BASE_MODEL: google/gemma-2b-it
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
      - ./native/autoencoder/triton_model_repository:/models:ro
    depends_on:
      redis:
        condition: service_healthy
      triton:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh redis"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  adapter-merge-worker:
    build:
      context: .
      dockerfile: native/autoencoder/Dockerfile.bridge
    container_name: phase-h-adapter-merge-worker
    command: ["python", "-m", "native.autoencoder.adapter_merge_worker"]
    environment:
      <<: *common-env
      TRITON_URL: http://triton:8000
    volumes:
      - ./native/autoencoder/artifacts:/app/native/autoencoder/artifacts
      - ./native/autoencoder/triton_model_repository:/models
    depends_on:
      redis:
        condition: service_healthy
      qlora-trainer:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/app/native/autoencoder/scripts/healthcheck.sh redis"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  #########################################
  # NEW: RAG Orchestrator with LangChain
  #########################################
  
  rag-orchestrator:
    build:
      context: ./python-services/rag-orchestrator
      dockerfile: Dockerfile
    container_name: legal-ai-rag-orchestrator
    ports:
      - "8004:8000"
    environment:
      <<: *common-env
      POSTGRES_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      LLM_URL: http://host.docker.internal:11434
      EMBEDDING_URL: http://fastapi-embed:8000
      LANGEXTRACT_URL: http://langextract:8090
      COLLECTION_NAME: legal_documents
      TOP_K: "10"
      SIMILARITY_THRESHOLD: "0.7"
      ENABLE_RERANKING: "true"
      ENABLE_WEB_SEARCH: "true"
    volumes:
      - ./python-services/rag-orchestrator:/app
      - rag_cache:/cache
    depends_on:
      - redis
      - qdrant
      - postgres
      - fastapi-embed
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  #########################################
  # LangExtract Web Scraping (Go Service)
  #########################################
  
  langextract:
    build:
      context: ./langextract-go
      dockerfile: Dockerfile
    container_name: legal-ai-langextract
    ports:
      - "8090:8090"
    environment:
      <<: *common-env
      LOG_LEVEL: info
      CACHE_TTL: "3600"
      MAX_WORKERS: "4"
    volumes:
      - ./langextract-go:/app
      - langextract_cache:/cache
    depends_on:
      - redis
      - qdrant
      - postgres
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  #########################################
  # QUIC Server (Your Existing)
  #########################################
  
  quic-server:
    build:
      context: .
      dockerfile: Dockerfile.quic
    container_name: legal-ai-quic
    ports:
      - "4433:4433/udp"
      - "4434:4434/udp"
      - "8095:8095"
    environment:
      <<: *common-env
      QUIC_PORT: "4433"
      ENABLE_GPU: "true"
    volumes:
      - ./go-services:/app/services
      - ./protobuf:/app/protobuf
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  #########################################
  # SvelteKit Frontend
  #########################################
  
  frontend:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.dev
    container_name: legal-ai-frontend
    ports:
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
      - "5176:5176"
      - "5177:5177"
      - "5178:5178"
      - "5179:5179"
      # HMR WebSocket ports
      - "6173:6173"
      - "6174:6174"
      - "6175:6175"
      - "6176:6176"
      - "6177:6177"
      - "6178:6178"
      - "6179:6179"
    environment:
      <<: *common-env
      NODE_ENV: development
      PUBLIC_API_URL: http://localhost:8004
      DEV_BYPASS_AUTH: "true"
      VITE_DEV_BYPASS_AUTH: "true"
    volumes:
      - ./sveltekit-frontend:/app
      - /app/node_modules
      - sveltekit_cache:/app/.svelte-kit
    depends_on:
      - postgres
      - redis
      - qdrant
      - rag-orchestrator
      - minio
      - rabbitmq
    networks:
      - legal-ai-network
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  #########################################
  # Caddy Reverse Proxy
  #########################################
  
  caddy:
    image: caddy:latest
    container_name: legal-ai-caddy
    ports:
      - "443:443/tcp"
      - "443:443/udp"
      - "80:80/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./Caddyfile.ws:/etc/caddy/Caddyfile.ws
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - legal-ai-network
    restart: unless-stopped

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  rabbitmq_data:
  fastapi_cache:
  rag_cache:
  langextract_cache:
  sveltekit_cache:
  caddy_data:
  caddy_config:
