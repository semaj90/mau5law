version: '3.8'

services:
  # Phase 72: Neo4j Graph Database for Error Relationships
  neo4j-phase72:
    image: neo4j:5.15
    container_name: legal-ai-neo4j-phase72
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'gds.*'
    ports:
      - "7474:7474"    # HTTP
      - "7687:7687"    # Bolt
    volumes:
      - neo4j_data_phase72:/data
      - neo4j_logs_phase72:/logs
    networks:
      - phase72-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 72: GPU Clustering Service
  gpu-clustering-phase72:
    build:
      context: .
      dockerfile: Dockerfile.gpu-clustering
    container_name: legal-ai-gpu-clustering-phase72
    environment:
      CUDA_VISIBLE_DEVICES: 0
      TORCH_USE_CUDA_DSA: 1
    volumes:
      - ./phase72-ast-reduction:/app
    networks:
      - phase72-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import torch; print('CUDA' if torch.cuda.is_available() else 'CPU')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 72: AI Patch Generation Service
  ai-patch-service-phase72:
    build:
      context: .
      dockerfile: Dockerfile.ai-patch
    container_name: legal-ai-patch-service-phase72
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      NEO4J_URI: bolt://neo4j-phase72:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./phase72-ast-reduction:/app
    networks:
      - phase72-network
    depends_on:
      neo4j-phase72:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('AI Patch Service Ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless_stopped

  # Phase 72: Error Analysis Dashboard
  error-analysis-dashboard:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile
    container_name: legal-ai-error-dashboard
    environment:
      NEO4J_URI: bolt://neo4j-phase72:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "5174:5173"  # Different port to avoid conflicts
    volumes:
      - ./sveltekit-frontend:/app
      - /app/node_modules
    networks:
      - phase72-network
      - legal-ai-network  # Connect to main network
    depends_on:
      neo4j-phase72:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless_stopped

  # Phase 72: Progress Monitoring Service
  progress-monitor-phase72:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: legal-ai-progress-monitor-phase72
    environment:
      NEO4J_URI: bolt://neo4j-phase72:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      MONITORING_INTERVAL: 60
    volumes:
      - ./phase72-ast-reduction:/app
      - progress_data:/app/progress
    networks:
      - phase72-network
    depends_on:
      neo4j-phase72:
        condition: service_healthy
    restart: unless_stopped

volumes:
  neo4j_data_phase72:
    driver: local
  neo4j_logs_phase72:
    driver: local
  progress_data:
    driver: local

networks:
  phase72-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
  legal-ai-network:
    external: true  # Connect to main Legal AI network