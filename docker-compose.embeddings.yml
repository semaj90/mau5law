version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_ai_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  fastembed:
    image: ghcr.io/yourorg/fastembed:latest
    # If you have a local GPU-friendly image, replace the image above.
    environment:
      - DEVICE=cuda
    ports:
      - "8001:8001"

  # Ollama: for users who run the Ollama daemon; the desktop app may not expose the HTTP API.
  # If you run Ollama locally, ensure `ollama serve` is running at port 11434 or set EMBEDDING_GPU_SERVICE_URL.
  ollama-placeholder:
    image: alpine
    command: ["/bin/sh", "-c", "echo 'Ollama placeholder. Use local Ollama or set EMBEDDING_GPU_SERVICE_URL.'; sleep infinity"]

volumes:
  pgdata:
