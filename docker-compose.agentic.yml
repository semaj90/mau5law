version: '3.8'

services:
  # Redis for agentic caching
  redis-agentic:
    image: redis:7-alpine
    container_name: redis-agentic
    restart: unless-stopped
    command: redis-server --requirepass redis --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_agentic_data:/data
    environment:
      - REDIS_PASSWORD=redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL with pgvector for semantic indexing
  postgres-pgvector:
    image: ankane/pgvector:latest
    container_name: postgres-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=agentic_legal_ai
      - POSTGRES_USER=agentic_user
      - POSTGRES_PASSWORD=agentic_pass
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_pgvector_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_user -d agentic_legal_ai"]
      interval: 10s
      timeout: 5s
      retries: 3

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-agentic
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@agentic.local
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-pgvector

volumes:
  redis_agentic_data:
    driver: local
  postgres_pgvector_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: agentic-network
    driver: bridge