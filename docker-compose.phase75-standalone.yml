version: '3.9'\n\n# Phase 75 Standalone Stack - Separate from existing containers\n# Use: docker-compose -f docker-compose.phase75-standalone.yml up -d\n\nservices:\n  # Qdrant Vector Database (R3 Semantic Cache)\n  qdrant-phase75:\n    image: qdrant/qdrant:latest\n    container_name: qdrant-phase75-r3-cache\n    ports:\n      - \"6334:6333\"  # Different port to avoid conflicts\n      - \"6335:6334\"\n    volumes:\n      - qdrant_phase75_storage:/qdrant/storage\n      - qdrant_phase75_snapshots:/qdrant/snapshots\n    environment:\n      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant-key-phase75}\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:6333/health\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - phase75-network\n    restart: unless-stopped\n\n  # EmbeddingGemma Service (768d embeddings)\n  embedding-service-phase75:\n    image: qdrant/qdrant:latest  # Placeholder - replace with actual embedding image\n    container_name: embedding-gemma-phase75\n    ports:\n      - \"8011:8001\"  # Different port\n    environment:\n      CUDA_VISIBLE_DEVICES: \"0\"\n      MODEL_NAME: \"google/gemma-2b\"\n      DEVICE: \"cuda\"\n      BATCH_SIZE: \"8\"\n      PYTHONUNBUFFERED: \"1\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8001/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - phase75-network\n    restart: unless-stopped\n    depends_on:\n      - qdrant-phase75\n\n  # Summary Service (S3+S4 Hybrid)\n  summary-service-phase75:\n    image: python:3.11-slim\n    container_name: summary-service-phase75\n    ports:\n      - \"8012:8002\"  # Different port\n    volumes:\n      - ./backend/services:/app/services\n    environment:\n      PYTHONUNBUFFERED: \"1\"\n      LOG_LEVEL: \"INFO\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8002/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - phase75-network\n    restart: unless-stopped\n    depends_on:\n      - embedding-service-phase75\n\n  # Pipeline Orchestrator\n  pipeline-orchestrator-phase75:\n    image: node:20-alpine\n    container_name: pipeline-orchestrator-phase75\n    ports:\n      - \"3011:3001\"  # Different port\n    volumes:\n      - ./backend:/app/backend\n      - ./sveltekit-frontend:/app/frontend\n      - ./:/app/workspace\n    environment:\n      NODE_ENV: \"development\"\n      EMBEDDING_SERVICE_URL: \"http://embedding-service-phase75:8001\"\n      SUMMARY_SERVICE_URL: \"http://summary-service-phase75:8002\"\n      QDRANT_URL: \"http://qdrant-phase75:6333\"\n      QDRANT_COLLECTION: \"r3_semantic_cache_phase75\"\n      MAX_CONCURRENCY: \"4\"\n      RETRY_ATTEMPTS: \"3\"\n      RETRY_DELAY_MS: \"1000\"\n      CHUNK_SIZE: \"1024\"\n      CHUNK_OVERLAP: \"256\"\n      WATCHER_ENABLED: \"true\"\n      LOG_LEVEL: \"info\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3001/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - phase75-network\n    restart: unless-stopped\n    depends_on:\n      - qdrant-phase75\n      - embedding-service-phase75\n      - summary-service-phase75\n\n  # Redis Cache (Phase 75 only)\n  redis-phase75:\n    image: redis:7-alpine\n    container_name: redis-phase75-cache\n    ports:\n      - \"6380:6379\"  # Different port\n    volumes:\n      - redis_phase75_data:/data\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - phase75-network\n    restart: unless-stopped\n\n  # MinIO Object Storage (Phase 75 only)\n  minio-phase75:\n    image: minio/minio:latest\n    container_name: minio-phase75-storage\n    ports:\n      - \"9010:9000\"  # Different port\n      - \"9011:9001\"\n    volumes:\n      - minio_phase75_data:/minio/data\n    environment:\n      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}\n      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}\n    command: server /minio/data --console-address \":9001\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:9000/minio/health/live\"]\n      interval: 30s\n      timeout: 20s\n      retries: 3\n    networks:\n      - phase75-network\n    restart: unless-stopped\n\nvolumes:\n  qdrant_phase75_storage:\n    driver: local\n  qdrant_phase75_snapshots:\n    driver: local\n  redis_phase75_data:\n    driver: local\n  minio_phase75_data:\n    driver: local\n\nnetworks:\n  phase75-network:\n    driver: bridge\n"