version: '3.8'

# Environment variables shared across services
x-common-env: &common-env
  environment:
    RUST_BACKTRACE: "1"
    RUST_LOG: info

x-postgres-env: &postgres-env
  POSTGRES_DB: ${DB_NAME:-legal_ai_db}
  POSTGRES_USER: ${DB_USER:-legal_admin}
  POSTGRES_PASSWORD: ${DB_PASSWORD:-legal123}

services:
  # ============================================
  # PostgreSQL with pgvector extension
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-postgres-pgvector
    <<: *common-env
    environment:
      <<: *postgres-env
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=vector"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================
  # Redis for caching and metrics
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: legal-redis-cache
    <<: *common-env
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ============================================
  # Ollama for embeddings and LLM fallback
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ollama-ai
    <<: *common-env
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_NUM_THREAD: "16"
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G
        reservations:
          cpus: '4'
          memory: 8G

  # ============================================
  # Qdrant Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qdrant-vectors
    <<: *common-env
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-admin}
      QDRANT_JWT_SECRET: ${QDRANT_JWT_SECRET:-secret}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================================
  # RabbitMQ for async task queue
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: legal-rabbitmq-queue
    <<: *common-env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================
  # MinIO for document storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: legal-minio-storage
    <<: *common-env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio/data
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  ollama-models:
    driver: local
  qdrant-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local

networks:
  legal-ai:
    driver: bridge
