# Phase 66 - Unified MCP Server Stack
# ESM + TSX + SIMD + Redis + pgvector + Ollama + TensorRT-LLM Integration
# Complete AI Pipeline Containerization

name: legal-ai

version: '3.8'

services:
  # Phase 64 MCP Server - Main AI Orchestrator
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.phase66
    container_name: phase66-mcp-server
    ports:
      - "3003:3003"  # MCP server port
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://host.docker.internal:11434
      - TENSORRT_LLM_URL=http://tensorrt-llm:8096
      - PGVECTOR_URL=http://postgres:5432
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./go-microservice:/app/go-microservice:ro
      - ./python-services:/app/python-services:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tensorrt-llm:
        condition: service_started
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/mcp/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: phase66-postgres
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=123456
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=1GB
      -c checkpoint_completion_target=0.9

  # Redis with persistence and optimization
  redis:
    image: redis/redis-stack:latest
    container_name: phase66-redis
    ports:
      - "6379:6379"   # Redis port
      - "18001:8001"  # RedisInsight port
    command: >
      redis-server
      --appendonly yes
      --port 6379
      --protected-mode no
      --bind 0.0.0.0
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/redistimeseries.so
      --loadmodule /opt/redis-stack/lib/rejson.so
      --loadmodule /opt/redis-stack/lib/redisbloom.so
    volumes:
      - redis_data:/data
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TensorRT-LLM GPU Inference Server
  tensorrt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: phase66-tensorrt-llm
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_HUB_CACHE=/workspace/cache
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8096:8096"  # HTTP API
      - "8097:8097"  # WebSocket
      - "8098:8098"  # Health check
    volumes:
      - tensorrt_models:/workspace/models:ro
      - tensorrt_engines:/workspace/engines
      - tensorrt_cache:/workspace/cache
      - ./models:/workspace/models:ro
    command:
      - bash
      - -lc
      - |
        set -e
        echo '🚀 Starting Phase 66 TensorRT-LLM Server...'
        if [ ! -d "/workspace/engines" ] || [ -z "$(ls -A /workspace/engines)" ]; then
          echo '⚠️  No TensorRT engines found. Building from model...'
          python3 -m tensorrt_llm.commands.build \
            --checkpoint_dir /workspace/models \
            --output_dir /workspace/engines \
            --max_batch_size 4 \
            --max_input_len 2048 \
            --max_seq_len 4096 \
            --max_beam_width 1 \
            --use_gemm_plugin auto \
            --use_gpt_attention_plugin float16 \
            --paged_kv_cache \
            --dtype float16 \
            --use_weight_only \
            --weight_only_precision int4_awq \
            --per_group \
            --group_size 128
        fi
        echo '🎯 Starting TensorRT-LLM inference server...'
        python3 -m tensorrt_llm.hlapi.llm_server \
          --host 0.0.0.0 \
          --port 8096 \
          --model /workspace/models \
          --tensorrt_llm_model_path /workspace/engines \
          --max_batch_size 4 \
          --max_input_len 2048 \
          --max_output_len 2048 \
          --tokenizer_type gemma
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8098/health || curl -f http://localhost:8096/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # Optional: Qdrant vector database for advanced operations
  qdrant:
    image: qdrant/qdrant:latest
    container_name: phase66-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO object storage for document management
  minio:
    image: minio/minio:latest
    container_name: phase66-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # RabbitMQ message broker for async processing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: phase66-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=legal_admin
      - RABBITMQ_DEFAULT_PASS=secret123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  tensorrt_models:
    driver: local
  tensorrt_engines:
    driver: local
  tensorrt_cache:
    driver: local

networks:
  phase66-network:
    name: legal-ai-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16