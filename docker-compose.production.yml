version: '3.8'

services:
  # Production Advanced AI API
  advanced-ai-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - RAY_HEAD_NODE=ray-head:6379
      - DISTRIBUTED_MODE=true
      - NUM_WORKERS=4
      - BATCH_SIZE=64
      - CACHE_TTL=7200
    volumes:
      - ./advanced-ai-integration:/app/advanced-ai-integration
      - ./models:/app/models
    depends_on:
      - redis
      - ray-head
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ray Head Node for Distributed Processing
  ray-head:
    image: rayproject/ray:latest
    command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0"]
    ports:
      - "6379:6379"
      - "8265:8265"  # Ray dashboard
    environment:
      - RAY_REDIS_ADDRESS=redis:6379
    volumes:
      - ray_data:/tmp/ray
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # Ray Worker Nodes
  ray-worker:
    image: rayproject/ray:latest
    command: ["ray", "start", "--address=ray-head:6379"]
    depends_on:
      - ray-head
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
          gpus: 1  # If GPU available

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL with pgvector for Vector Storage
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: legal_ai_prod
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d legal_ai_prod"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SvelteKit Frontend (Production Build)
  sveltekit-frontend:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_BASE=http://advanced-ai-api:8001
      - PUBLIC_WS_URL=ws://advanced-ai-api:8001/ws/advanced-ai
      - DATABASE_URL=postgresql://ai_user:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/legal_ai_prod
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - advanced-ai-api
      - postgres
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - sveltekit-frontend
      - advanced-ai-api
    deploy:
      placement:
        constraints:
          - node.role == manager

  # GPU Monitoring (if GPUs available)
  gpu-monitor:
    image: nvidia/cuda:11.8-runtime-ubuntu20.04
    command: nvidia-smi --query-gpu=index,name,memory.used,memory.total,temperature.gpu --format=csv,noheader,nounits --loop=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

volumes:
  redis_data:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  ray_data:
  nginx_logs:

networks:
  default:
    driver: overlay
    attachable: true