name: Error-Brain Dry-Run Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  error-brain-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sveltekit-frontend/package-lock.json

      - name: Install dependencies
        working-directory: sveltekit-frontend
        run: npm ci

      - name: Run error-brain analyzer (dry-run only)
        working-directory: sveltekit-frontend
        env:
          ERROR_BRAIN_ENABLED: 'true'
          ERROR_BRAIN_DRY_RUN: 'true'
          ERROR_BRAIN_APPLY_MODE: 'off'
          ERROR_BRAIN_TRANSPORT: 'none'
          BATCH_REPORT_STAMP: ${{ github.run_id }}-${{ github.run_number }}
        run: |
          node scripts/batch-merger-fixer-v2.mjs --analyze

      - name: Check for critical errors
        working-directory: sveltekit-frontend
        run: |
          if [ -f "reports/batch-analysis-*.json" ]; then
            echo "✅ Analysis complete"
            cat reports/batch-analysis-*.json | jq '.summary'
          else
            echo "❌ Analysis failed - no report generated"
            exit 1
          fi

      - name: Upload error-brain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-brain-reports-${{ github.run_id }}
          path: sveltekit-frontend/reports/
          retention-days: 7

      - name: Comment PR with summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportsDir = 'sveltekit-frontend/reports';
            const analysisFiles = fs.readdirSync(reportsDir)
              .filter(f => f.startsWith('batch-analysis-') && f.endsWith('.json'));

            if (analysisFiles.length === 0) {
              return;
            }

            const report = JSON.parse(
              fs.readFileSync(path.join(reportsDir, analysisFiles[0]), 'utf8')
            );

            const summary = report.summary || {};
            const body = `
            ## 🤖 Error-Brain Analysis Report

            | Metric | Value |
            |--------|-------|
            | Files analyzed | ${summary.filesAnalyzed || 0} |
            | Issues found | ${summary.totalIssues || 0} |
            | High priority | ${summary.highPriority || 0} |
            | Medium priority | ${summary.mediumPriority || 0} |

            **Status:** ${summary.totalIssues === 0 ? '✅ Clean' : '⚠️ Issues detected'}

            <details>
            <summary>View top issues</summary>

            ${report.files?.slice(0, 5).map(f =>
              `- \`${f.path}\`: ${f.patterns?.length || 0} issues`
            ).join('\n') || 'No issues'}

            </details>

            [View full report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
