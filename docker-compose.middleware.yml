services:
  rag-kag-middleware:
    build:
      context: ./python-services/rag-kag-middleware
      dockerfile: Dockerfile
    container_name: phase87-rag-middleware
    ports:
      - "8765:8765"
    environment:
      # Connect to services running on the host (phase66-* containers mapped to host ports)
      COUCHDB_URL: http://admin:legal_ai_pass@host.docker.internal:5984
      DATABASE_URL: postgresql://user:pass@host.docker.internal:5434/legal
      QDRANT_URL: http://host.docker.internal:6333
      REDIS_URL: redis://host.docker.internal:6379
      OLLAMA_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: embeddinggemma:latest
      LLM_MODEL: gemma3-legal:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python-services/rag-kag-middleware:/app
