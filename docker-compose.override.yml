# Docker Compose Override for TensorRT-LLM Legal AI Production Integration
# Usage: docker-compose -f docker-compose.existing-stack.yml -f docker-compose.override.yml up -d
version: '3.8'

services:
  # TensorRT-LLM Legal AI Inference Service
  legal-ai-tensorrt:
    build:
      context: .
      dockerfile: legal-ai-tensorrt.dockerfile
    container_name: legal-ai-tensorrt
    environment:
      # Connect to your existing PostgreSQL 17 + pgvector GPU containers
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5433
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456

      # Infrastructure services from docker-compose.existing-stack.yml
      REDIS_HOST: redis-legal
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis

      RABBITMQ_HOST: rabbitmq-legal
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: legal_admin
      RABBITMQ_PASSWORD: legal123

      MINIO_HOST: minio-legal
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: legal_admin
      MINIO_SECRET_KEY: legal_storage_key

      QDRANT_HOST: qdrant-legal
      QDRANT_PORT: 6333

      # TensorRT-LLM Configuration
      TENSORRT_LLM_MODEL_PATH: /app/models/gemma3-legal
      TENSORRT_ENGINE_PATH: /app/engines/gemma3-legal.engine

      # Ollama integration (for fallback/comparison)
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: 11434

      # GPU settings for TensorRT-LLM
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: 0
      TENSORRT_VERBOSE: 1

      # Performance tuning
      MAX_BATCH_SIZE: 8
      MAX_INPUT_LEN: 2048
      MAX_OUTPUT_LEN: 1024

    ports:
      - "8096:8096"   # TensorRT-LLM API (different from Ollama 8095)
      - "8097:8097"   # Health/metrics endpoint

    volumes:
      # Mount your TensorRT-LLM environment
      - ./TensorRT-LLM/tensorrt_env:/opt/tensorrt_env:ro
      - ./models:/app/models:ro
      - ./engines:/app/engines:rw
      - ./proto:/app/proto:ro

    networks:
      - legal-ai-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      redis-legal:
        condition: service_healthy
      rabbitmq-legal:
        condition: service_healthy
      minio-legal:
        condition: service_healthy
      qdrant-legal:
        condition: service_healthy

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # TensorRT engine loading takes time

  # Load Balancer for Legal AI Services
  nginx-legal-tensorrt:
    image: nginx:alpine
    container_name: nginx-legal-tensorrt
    ports:
      - "8090:80"     # Unified legal AI endpoint
      - "8443:443"    # SSL endpoint
    volumes:
      - ./nginx-legal-tensorrt.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - legal-ai-network
    depends_on:
      - legal-ai-tensorrt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Extend the existing network from docker-compose.existing-stack.yml
networks:
  legal-ai-network:
    external: true

# Additional volumes for TensorRT engines and models
volumes:
  tensorrt_engines:
    driver: local
  legal_models:
    driver: local