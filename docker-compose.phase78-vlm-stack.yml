version: '3.9'\n\n# Phase 78-82: Gemma-3 VLM Stack\n# Litigation-focused multimodal embeddings (1024d)\n# F3 Domain: Human trafficking, CPS, forced labor, threats\n\nservices:\n  # PostgreSQL 17 with pgvector (1024d embeddings)\n  postgres-vlm:\n    image: pgvector/pgvector:pg17-latest\n    container_name: postgres-vlm-phase78\n    ports:\n      - \"5433:5432\"  # Different port from existing\n    volumes:\n      - postgres_vlm_data:/var/lib/postgresql/data\n      - ./backend/migrations/migrate_embeddings_1024d.sql:/docker-entrypoint-initdb.d/01-migrate.sql\n    environment:\n      POSTGRES_DB: legal_vlm\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}\n      PGVECTOR_EXTENSION: \"true\"\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - phase78-network\n    restart: unless-stopped\n\n  # Qdrant Vector Database (1024d)\n  qdrant-vlm:\n    image: qdrant/qdrant:latest\n    container_name: qdrant-vlm-phase78\n    ports:\n      - \"6336:6333\"  # Different port\n      - \"6337:6334\"\n    volumes:\n      - qdrant_vlm_storage:/qdrant/storage\n      - qdrant_vlm_snapshots:/qdrant/snapshots\n    environment:\n      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant-key-phase78}\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:6333/health\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - phase78-network\n    restart: unless-stopped\n\n  # Gemma-3 VLM Embedding Service (1024d)\n  gemma-vlm-embedding:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile.gemma-vlm\n    container_name: gemma-vlm-embedding-phase78\n    ports:\n      - \"8021:8001\"  # Different port\n    volumes:\n      - ./backend/services:/app/services\n      - embedding_vlm_cache:/root/.cache\n      - models_vlm_cache:/models/cache\n    environment:\n      CUDA_VISIBLE_DEVICES: \"0\"\n      MODEL_NAME: \"google/gemma-3-2b-it-v\"\n      DEVICE: \"cuda\"\n      BATCH_SIZE: \"4\"\n      MAX_LENGTH: \"512\"\n      PYTHONUNBUFFERED: \"1\"\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: 1\n              capabilities: [gpu]\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8001/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - phase78-network\n    restart: unless-stopped\n    depends_on:\n      - qdrant-vlm\n\n  # California Constitution Ingestion Service\n  ca-const-ingestor:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile.ca-const-ingest\n    container_name: ca-const-ingestor-phase78\n    ports:\n      - \"8022:8002\"  # Different port\n    volumes:\n      - ./backend/services:/app/services\n      - ./data/ca_constitution:/app/data/ca_constitution\n    environment:\n      PYTHONUNBUFFERED: \"1\"\n      LOG_LEVEL: \"INFO\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8002/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - phase78-network\n    restart: unless-stopped\n    depends_on:\n      - gemma-vlm-embedding\n\n  # Redis Cache (Phase 78 only)\n  redis-vlm:\n    image: redis:7-alpine\n    container_name: redis-vlm-phase78\n    ports:\n      - \"6381:6379\"  # Different port\n    volumes:\n      - redis_vlm_data:/data\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - phase78-network\n    restart: unless-stopped\n\n  # MinIO Object Storage (Phase 78 only)\n  minio-vlm:\n    image: minio/minio:latest\n    container_name: minio-vlm-phase78\n    ports:\n      - \"9020:9000\"  # Different port\n      - \"9021:9001\"\n    volumes:\n      - minio_vlm_data:/minio/data\n    environment:\n      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}\n      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}\n    command: server /minio/data --console-address \":9001\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:9000/minio/health/live\"]\n      interval: 30s\n      timeout: 20s\n      retries: 3\n    networks:\n      - phase78-network\n    restart: unless-stopped\n\n  # Prometheus Metrics (Phase 78 only)\n  prometheus-vlm:\n    image: prom/prometheus:latest\n    container_name: prometheus-vlm-phase78\n    ports:\n      - \"9091:9090\"  # Different port\n    volumes:\n      - ./monitoring/prometheus-vlm.yml:/etc/prometheus/prometheus.yml\n      - prometheus_vlm_data:/prometheus\n    command:\n      - '--config.file=/etc/prometheus/prometheus.yml'\n      - '--storage.tsdb.path=/prometheus'\n    networks:\n      - phase78-network\n    restart: unless-stopped\n\nvolumes:\n  postgres_vlm_data:\n    driver: local\n  qdrant_vlm_storage:\n    driver: local\n  qdrant_vlm_snapshots:\n    driver: local\n  embedding_vlm_cache:\n    driver: local\n  models_vlm_cache:\n    driver: local\n  redis_vlm_data:\n    driver: local\n  minio_vlm_data:\n    driver: local\n  prometheus_vlm_data:\n    driver: local\n\nnetworks:\n  phase78-network:\n    driver: bridge\n"