version: '3.8'

services:
  # Phase 70: TensorRT-LLM Service
  tensorrt-llm-service:
    build:
      context: .
      dockerfile: Dockerfile.tensorrt
    container_name: phase70-tensorrt-llm
    ports:
      - "8099:8099"
    volumes:
      - ./data/models:/app/models:ro
      - ./data/tensorrt_engines:/app/tensorrt_engines:ro
      - ./data/tokenizers:/app/tokenizers:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TENSORRT_PORT=8099
      - TENSORRT_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 70: PyTorch Fallback Service
  pytorch-fallback-service:
    build:
      context: .
      dockerfile: Dockerfile.pytorch
    container_name: phase70-pytorch-fallback
    ports:
      - "8100:8100"
    volumes:
      - ./data/models:/app/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 70: OCR Service
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: phase70-ocr
    ports:
      - "8101:8101"
    volumes:
      - ./data/uploads:/app/uploads
    environment:
      - OCR_PORT=8101
      - OCR_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 70: Language Extraction Service
  lang-extract-service:
    build:
      context: .
      dockerfile: Dockerfile.lang
    container_name: phase70-lang-extract
    ports:
      - "8102:8102"
    environment:
      - LANG_EXTRACT_PORT=8102
      - LANG_EXTRACT_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 70: Web Crawl Service
  web-crawl-service:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: phase70-web-crawl
    ports:
      - "8103:8103"
    environment:
      - WEB_CRAWL_PORT=8103
      - WEB_CRAWL_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Phase 70: RAG Ingest Service
  rag-ingest-service:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: phase70-rag-ingest
    ports:
      - "8104:8104"
    volumes:
      - ./data/chroma_db:/app/chroma_db
      - ./data/uploads:/app/uploads
    environment:
      - RAG_INGEST_PORT=8104
      - RAG_INGEST_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: phase70-network