version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: legal-ai-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    networks:
      - legal-ai-network

  # Neo4j backup service (optional)
  neo4j-backup:
    image: neo4j:5.15-community
    container_name: legal-ai-neo4j-backup
    depends_on:
      - neo4j
    environment:
      - NEO4J_AUTH=neo4j/newSecurePassword123.
    volumes:
      - neo4j_backup:/backup
      - ./backup-scripts:/scripts
    command: >
      sh -c "
        echo 'Starting backup service...' &&
        while true; do
          sleep 86400 # Wait 24 hours
          neo4j-admin database dump --database=neo4j --to-path=/backup/neo4j-$(date +%Y%m%d-%H%M%S).dump || echo 'Backup failed'
        done
      "
    networks:
      - legal-ai-network
    restart: unless-stopped
    profiles:
      - backup

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  neo4j_backup:
    driver: local

networks:
  legal-ai-network:
    driver: bridge

# Usage Instructions:
# 1. Start Neo4j: docker-compose -f neo4j-docker-compose.yml up -d neo4j
# 2. Access Neo4j Browser: http://localhost:7474 (username: neo4j, password: neo4j123)
# 3. Start with backup: docker-compose -f neo4j-docker-compose.yml --profile backup up -d
# 4. Stop services: docker-compose -f neo4j-docker-compose.yml down
# 5. Remove data: docker-compose -f neo4j-docker-compose.yml down -v