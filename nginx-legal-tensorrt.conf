events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream backends for legal AI services
    upstream legal_ai_tensorrt {
        least_conn;
        server legal-ai-tensorrt:8096 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream legal_ai_ollama {
        least_conn;
        server host.docker.internal:11434 max_fails=3 fail_timeout=30s backup;
        keepalive 16;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=heavy:10m rate=2r/s;

    server {
        listen 80;
        server_name legal-ai.local;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "Legal AI Stack Healthy\n";
            add_header Content-Type text/plain;
        }

        # TensorRT-LLM primary inference endpoints
        location /api/legal/tensorrt/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://legal_ai_tensorrt/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings for inference
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Ollama fallback endpoints
        location /api/legal/ollama/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://legal_ai_ollama/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;
        }

        # Heavy processing endpoints (document ingestion, batch processing)
        location /api/legal/batch/ {
            limit_req zone=heavy burst=5 nodelay;

            proxy_pass http://legal_ai_tensorrt/batch/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for batch processing
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 600s;

            # Large file uploads
            client_max_body_size 100M;
        }

        # Real-time legal query endpoint
        location /api/legal/query {
            limit_req zone=api burst=15 nodelay;

            proxy_pass http://legal_ai_tensorrt/legal/query;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # WebSocket support for streaming responses
        location /api/legal/stream {
            proxy_pass http://legal_ai_tensorrt/legal/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Metrics and monitoring
        location /metrics {
            limit_req zone=api burst=5 nodelay;

            proxy_pass http://legal_ai_tensorrt/legal/stats;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files and documentation
        location /docs/ {
            proxy_pass http://legal_ai_tensorrt/docs/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Default route
        location / {
            return 200 "Legal AI TensorRT-LLM Service\nEndpoints:\n- /api/legal/query (Primary inference)\n- /api/legal/tensorrt/ (TensorRT-LLM)\n- /api/legal/ollama/ (Fallback)\n- /health (Health check)\n- /metrics (Statistics)\n";
            add_header Content-Type text/plain;
        }
    }

    # SSL Configuration (optional)
    server {
        listen 443 ssl http2;
        server_name legal-ai.local;

        ssl_certificate /etc/nginx/ssl/legal-ai.crt;
        ssl_certificate_key /etc/nginx/ssl/legal-ai.key;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Same location blocks as HTTP server
        include /etc/nginx/conf.d/legal-ai-locations.conf;
    }
}