version: '3.8'

# Complete Optimized Legal AI Stack
# TensorRT-LLM Q4_K_M + Go microservices + SvelteKit 2 + Caddy QUIC

services:
  # TensorRT-LLM Q4_K_M Inference Engine
  tensorrt-llm:
    build:
      context: .
      dockerfile: Dockerfile.tensorrt-llm-optimized
    container_name: legal-ai-tensorrt-llm
    restart: unless-stopped

    # GPU access for RTX 3060 Ti
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TENSORRT_ENGINE_DIR=/engines/gemma3-legal-q4km-rtx3060ti
      - GRPC_PORT=8100
      - HTTP_PORT=8080

    ports:
      - "8100:8100"  # gRPC for Go microservices
      - "8080:8080"  # HTTP for SvelteKit

    volumes:
      - ./engines:/engines:ro
      - ./models:/models:ro
      - tensorrt-cache:/tmp/tensorrt

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    command: >
      python tensorrt-llm-server.py
      --engine_dir /engines/gemma3-legal-q4km-rtx3060ti
      --grpc_port 8100
      --http_port 8080

  # Optimized Go Microservices
  legal-ai-go:
    build:
      context: ./go-microservice/optimized-legal-stack
      dockerfile: Dockerfile.optimized
    container_name: legal-ai-go-optimized
    restart: unless-stopped

    environment:
      - TENSORRT_LLM_ENDPOINT=http://tensorrt-llm:8080
      - QUIC_PORT=8103
      - GRPC_PORT=8104
      - HTTP_PORT=8105
      - CUDA_GRAPHS_ENABLED=true
      - SIMD_JSON_ENABLED=true

    ports:
      - "8103:8103"  # QUIC/HTTP3
      - "8104:8104"  # gRPC
      - "8105:8105"  # HTTP/2

    depends_on:
      tensorrt-llm:
        condition: service_healthy

    volumes:
      - ./legal-documents:/legal-documents:ro
      - go-cache:/go/pkg/mod

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # SvelteKit 2 Frontend (Development)
  sveltekit-dev:
    build:
      context: .
      dockerfile: Dockerfile.sveltekit-optimized
    container_name: legal-ai-sveltekit-dev
    restart: unless-stopped

    environment:
      - NODE_ENV=development
      - VITE_TENSORRT_LLM_ENDPOINT=http://localhost:8080
      - VITE_QUIC_ENDPOINT=https://localhost:8103
      - VITE_GO_API_ENDPOINT=http://localhost:8105

    ports:
      - "5173:5173"  # SvelteKit dev server

    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - sveltekit-cache:/app/.svelte-kit

    depends_on:
      - legal-ai-go

    command: npm run dev -- --host 0.0.0.0 --port 5173

  # SvelteKit 2 Frontend (Production)
  sveltekit-prod:
    build:
      context: .
      dockerfile: Dockerfile.sveltekit-production
      target: production
    container_name: legal-ai-sveltekit-prod
    restart: unless-stopped

    environment:
      - NODE_ENV=production

    ports:
      - "4173:4173"  # Production preview

    volumes:
      - ./build:/app/build:ro

    profiles:
      - production

  # Caddy HTTP/3 QUIC Proxy
  caddy:
    image: caddy:2.7-alpine
    container_name: legal-ai-caddy
    restart: unless-stopped

    ports:
      - "3000:3000"   # Main application
      - "3443:3443"   # HTTPS
      - "2019:2019"   # Caddy admin

    volumes:
      - ./Caddyfile.optimized:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - sveltekit-dev
      - legal-ai-go
      - tensorrt-llm

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

  # PostgreSQL for legal document metadata
  postgres:
    image: postgres:16-alpine
    container_name: legal-ai-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=secure_legal_password
      - PGDATA=/var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: legal-ai-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

    profiles:
      - monitoring

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: legal-ai-grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=legal_ai_dashboard

    ports:
      - "3001:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    profiles:
      - monitoring

volumes:
  # Engine and model storage
  tensorrt-cache:
    driver: local

  # Application caches
  go-cache:
    driver: local
  node-modules:
    driver: local
  sveltekit-cache:
    driver: local

  # Proxy and web server
  caddy-data:
    driver: local
  caddy-config:
    driver: local

  # Database storage
  redis-data:
    driver: local
  postgres-data:
    driver: local

  # Monitoring
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: legal-ai-optimized
    driver: bridge

# Health check and management commands
x-healthcheck-commands:
  - &tensorrt-health "curl -f http://tensorrt-llm:8080/health"
  - &go-health "curl -f http://legal-ai-go:8105/health"
  - &caddy-health "curl -f http://caddy:2019/config/"