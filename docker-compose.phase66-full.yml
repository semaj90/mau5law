# Phase 66 Full Stack - Unified Legal AI Platform
# SvelteKit Frontend + Caddy QUIC + MCP Server + TensorRT-LLM + PostgreSQL + Redis + MinIO + Qdrant + RabbitMQ
# Complete RAG pipeline with evidence ingestion, OCR, embeddings, and GPU inference

name: legal-ai

services:
  # ---------------------- FRONTEND ----------------------
  sveltekit-frontend:
    env_file:
      - .env.phase66.generated
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.dev
    container_name: sveltekit-frontend
    environment:
      PUBLIC_VITE_API_URL: http://phase66-mcp-server:3003
      PUBLIC_VITE_MINIO_URL: http://phase66-minio:9000
      PUBLIC_VITE_OLLAMA_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql://postgres:postgres@phase66-postgres:5432/legalai
      REDIS_URL: redis://phase66-redis:6379
    ports:
      - "5173:5173"
    networks:
      - phase66-network
    depends_on:
      - phase66-mcp-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy-quic:
    image: caddy:2.8-alpine
    container_name: legal-ai-caddy-quic
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - phase66-network

  # ---------------------- BACKEND CORE ----------------------
  phase66-mcp-server:
    env_file:
      - .env.phase66.generated
    build:
      context: .
      dockerfile: Dockerfile.phase66
    container_name: phase66-mcp-server
    command: ["npx", "tsx", "src/server.ts"]
    environment:
      PG_URL: postgresql://postgres:postgres@phase66-postgres:5432/legalai
      REDIS_URL: redis://phase66-redis:6379
      MINIO_URL: http://phase66-minio:9000
      QDRANT_URL: http://phase66-qdrant:6333
      RABBITMQ_URL: amqp://guest:guest@phase66-rabbitmq:5672/
      OLLAMA_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: embeddinggemma:latest
      NODE_ENV: production
    depends_on:
      phase66-postgres:
        condition: service_healthy
      phase66-redis:
        condition: service_healthy
      phase66-minio:
        condition: service_started
      phase66-qdrant:
        condition: service_started
    ports:
      - "3003:3003"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - phase66-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/mcp/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------- GPU INFERENCE ----------------------
  phase66-tensorrt-llm:
    env_file:
      - .env.phase66.generated
    build:
      context: .
      dockerfile: Dockerfile.trtllm
    container_name: phase66-tensorrt-llm
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      REDIS_URL: redis://phase66-redis:6379
      PG_URL: postgresql://postgres:postgres@phase66-postgres:5432/legalai
      TORCH_CUDA_DEVICE: "0"
    volumes:
      - ./models:/models
      - tensorrt_models:/app/models
      - tensorrt_engines:/app/engines
      - tensorrt_cache:/root/.cache
    ports:
      - "8099:8099"
    restart: unless-stopped
    networks:
      - phase66-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  # ---------------------- DATABASE & CACHE ----------------------
  phase66-postgres:
    env_file:
      - .env.phase66.generated
    image: pgvector/pgvector:pg17
    container_name: phase66-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legalai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - phase66-network
    restart: unless-stopped

  phase66-redis:
    env_file:
      - .env.phase66.generated
    image: redis/redis-stack:latest
    container_name: phase66-redis
    ports:
      - "6379:6379"
      - "18001:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - phase66-network
    restart: unless-stopped

  phase66-qdrant:
    env_file:
      - .env.phase66.generated
    image: qdrant/qdrant:latest
    container_name: phase66-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - phase66-network
    restart: unless-stopped

  phase66-minio:
    env_file:
      - .env.phase66.generated
    image: minio/minio:latest
    container_name: phase66-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  phase66-rabbitmq:
    env_file:
      - .env.phase66.generated
    image: rabbitmq:3-management-alpine
    container_name: phase66-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - phase66-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  agentic-bridge:
    build:
      context: .
      dockerfile: python_codebase/python-services/Dockerfile.agentic
    container_name: phase68-agentic-bridge
    restart: unless-stopped
    depends_on:
      - phase66-redis
      - phase66-postgres
    ports:
      - "8088:8088"
    environment:
      REDIS_URL: redis://phase66-redis:6379
      PG_URL: postgresql://postgres:postgres@phase66-postgres:5432/legalai
    networks:
      - phase66-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  tensorrt_models:
    driver: local
  tensorrt_engines:
    driver: local
  tensorrt_cache:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  phase66-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
