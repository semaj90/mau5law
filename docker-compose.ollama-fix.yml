version: '3.8'

services:
  # Ollama for AI models - Fixed port to avoid conflict
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ai-ollama-fixed
    ports:
      - "11435:11434"  # Map to port 11435 to avoid conflict with existing 11434
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
    name: legal-ai-ollama-data