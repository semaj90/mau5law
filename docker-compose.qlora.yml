version: '3.8'

# Phase AST: QLoRA Training Microservice Stack
services:
  # Main QLoRA Training Service (C++ with CUDA)
  qlora-trainer:
    build:
      context: ./cpp-ast-exporter
      dockerfile: Dockerfile.qlora
    container_name: legal-ai-qlora-trainer
    ports:
      - "8098:8098"  # gRPC service port
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_CUDA_ARCH_LIST=8.6  # RTX 3060
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./checkpoints:/app/checkpoints
    networks:
      - legal-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8098"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Dataset Ingestion Service
  dataset-ingestion:
    build:
      context: ./cpp-ast-exporter
      dockerfile: Dockerfile.ingestion
    container_name: legal-ai-dataset-ingestion
    ports:
      - "8099:8099"  # gRPC service port
    environment:
      - NUM_THREADS=16
      - MAX_MEMORY_GB=32
    volumes:
      - ./datasets:/app/datasets
      - ./processed_datasets:/app/processed_datasets
    networks:
      - legal-ai-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8099"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # TensorRT-LLM Inference Service
  tensorrt-llm-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.tensorrt-llm
    container_name: legal-ai-tensorrt-llm-service
    ports:
      - "8100:8100"  # gRPC inference port
      - "8101:8101"  # HTTP API port
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TENSORRT_LLM_MODEL=gemma-3-4b-it
      - MAX_BATCH_SIZE=8
      - MAX_SEQ_LENGTH=2048
      - QUANTIZATION=fp16
    volumes:
      - ./engines:/app/engines
      - ./models:/app/models
      - ./adapters:/app/adapters
    networks:
      - legal-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis for caching and coordination
  redis:
    image: redis:7.2-alpine
    container_name: legal-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf
    networks:
      - legal-ai-network
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # MinIO for model and dataset storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: legal-ai-minio
    ports:
      - "9000:9000"    # API port
      - "9001:9001"    # Console port
    environment:
      - MINIO_ROOT_USER=legalai
      - MINIO_ROOT_PASSWORD=legalai2024!
      - MINIO_REGION=us-east-1
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # QLoRA Training Monitor/Dashboard
  training-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    container_name: legal-ai-training-monitor
    ports:
      - "3000:3000"  # Web dashboard
    environment:
      - REDIS_URL=redis://redis:6379
      - TRAINER_GRPC_URL=qlora-trainer:8098
      - INGESTION_GRPC_URL=dataset-ingestion:8099
    volumes:
      - ./logs:/app/logs
    networks:
      - legal-ai-network
    depends_on:
      - redis
      - qlora-trainer
      - dataset-ingestion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # GPU Metrics Exporter
  gpu-metrics-exporter:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile.metrics
    container_name: legal-ai-gpu-metrics
    ports:
      - "9100:9100"  # Prometheus metrics
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - UPDATE_INTERVAL=5s
    networks:
      - legal-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
  minio_data:
  checkpoints:
  processed_datasets: