version: '3.9'\n\nservices:\n  # Qdrant Vector Database (R3 Semantic Cache)\n  qdrant:\n    image: qdrant/qdrant:latest\n    container_name: qdrant-r3-cache\n    ports:\n      - \"6333:6333\"\n      - \"6334:6334\"\n    volumes:\n      - qdrant_storage:/qdrant/storage\n      - qdrant_snapshots:/qdrant/snapshots\n    environment:\n      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant-key-123}\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:6333/health\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n\n  # EmbeddingGemma Service (768d embeddings)\n  embedding-service:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile.embedding-gemma\n    container_name: embedding-gemma-service\n    ports:\n      - \"8001:8001\"\n    volumes:\n      - ./backend/services:/app/services\n      - embedding_cache:/root/.cache\n      - models_cache:/models/cache\n    environment:\n      CUDA_VISIBLE_DEVICES: \"0\"\n      MODEL_NAME: \"google/gemma-2b\"\n      DEVICE: \"cuda\"\n      BATCH_SIZE: \"8\"\n      MAX_LENGTH: \"512\"\n      PYTHONUNBUFFERED: \"1\"\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: 1\n              capabilities: [gpu]\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8001/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n    depends_on:\n      - qdrant\n\n  # Summary Service (S3+S4 Hybrid)\n  summary-service:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile.summary-service\n    container_name: summary-service\n    ports:\n      - \"8002:8002\"\n    volumes:\n      - ./backend/services:/app/services\n    environment:\n      PYTHONUNBUFFERED: \"1\"\n      LOG_LEVEL: \"INFO\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8002/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n    depends_on:\n      - embedding-service\n\n  # Code Ingestion Pipeline Orchestrator\n  pipeline-orchestrator:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile.pipeline\n    container_name: pipeline-orchestrator\n    ports:\n      - \"3001:3001\"\n    volumes:\n      - ./backend:/app/backend\n      - ./sveltekit-frontend:/app/frontend\n      - ./:/app/workspace\n    environment:\n      NODE_ENV: \"development\"\n      EMBEDDING_SERVICE_URL: \"http://embedding-service:8001\"\n      SUMMARY_SERVICE_URL: \"http://summary-service:8002\"\n      QDRANT_URL: \"http://qdrant:6333\"\n      QDRANT_COLLECTION: \"r3_semantic_cache\"\n      MAX_CONCURRENCY: \"4\"\n      RETRY_ATTEMPTS: \"3\"\n      RETRY_DELAY_MS: \"1000\"\n      CHUNK_SIZE: \"1024\"\n      CHUNK_OVERLAP: \"256\"\n      WATCHER_ENABLED: \"true\"\n      LOG_LEVEL: \"info\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3001/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n    depends_on:\n      - qdrant\n      - embedding-service\n      - summary-service\n\n  # Redis Cache (optional, for session/state)\n  redis:\n    image: redis:7-alpine\n    container_name: redis-cache\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n\n  # MinIO Object Storage (for future QLoRA dataset)\n  minio:\n    image: minio/minio:latest\n    container_name: minio-storage\n    ports:\n      - \"9000:9000\"\n      - \"9001:9001\"\n    volumes:\n      - minio_data:/minio/data\n    environment:\n      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}\n      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}\n    command: server /minio/data --console-address \":9001\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:9000/minio/health/live\"]\n      interval: 30s\n      timeout: 20s\n      retries: 3\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n\n  # Prometheus Metrics (optional)\n  prometheus:\n    image: prom/prometheus:latest\n    container_name: prometheus-metrics\n    ports:\n      - \"9090:9090\"\n    volumes:\n      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml\n      - prometheus_data:/prometheus\n    command:\n      - '--config.file=/etc/prometheus/prometheus.yml'\n      - '--storage.tsdb.path=/prometheus'\n    networks:\n      - pipeline-network\n    restart: unless-stopped\n\nvolumes:\n  qdrant_storage:\n    driver: local\n  qdrant_snapshots:\n    driver: local\n  embedding_cache:\n    driver: local\n  models_cache:\n    driver: local\n  redis_data:\n    driver: local\n  minio_data:\n    driver: local\n  prometheus_data:\n    driver: local\n\nnetworks:\n  pipeline-network:\n    driver: bridge\n"