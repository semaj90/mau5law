version: '3.8'

# Advanced Multimodal Retriever Engine - Docker Compose
# Includes: PostgreSQL, Qdrant, Redis, Neo4j, MinIO, RabbitMQ
# GPU support for CUDA acceleration

services:
  # ============================================================================
  # Database Services
  # ============================================================================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: multimodal-postgres
    environment:
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: multimodal_retriever
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d multimodal_retriever"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multimodal-network
    restart: unless-stopped

  # ============================================================================
  # Vector Search Services
  # ============================================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: multimodal-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT_HOST: 0.0.0.0
      QDRANT_LOG_LEVEL: INFO
      QDRANT_API_KEY: multimodal_key_123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multimodal-network
    restart: unless-stopped

  # ============================================================================
  # Cache Services
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: multimodal-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass multimodal_redis_123 --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "multimodal_redis_123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multimodal-network
    restart: unless-stopped

  # ============================================================================
  # Graph Database
  # ============================================================================

  neo4j:
    image: neo4j:5-community
    container_name: multimodal-neo4j
    environment:
      NEO4J_AUTH: neo4j/multimodal_neo4j_123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "multimodal_neo4j_123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - multimodal-network
    restart: unless-stopped

  # ============================================================================
  # Object Storage
  # ============================================================================

  minio:
    image: minio/minio:latest
    container_name: multimodal-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - multimodal-network
    restart: unless-stopped

  # ============================================================================
  # Message Queue
  # ============================================================================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: multimodal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - multimodal-network
    restart: unless-stopped

  # ============================================================================
  # Backend API Service (Optional - for development)
  # ============================================================================

  # backend:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   container_name: multimodal-backend
  #   environment:
  #     POSTGRES_URL: postgresql://legal_admin:secure_password_123@postgres:5432/multimodal_retriever
  #     QDRANT_URL: http://qdrant:6333
  #     REDIS_URL: redis://:multimodal_redis_123@redis:6379/0
  #     NEO4J_URI: bolt://neo4j:7687
  #     NEO4J_USER: neo4j
  #     NEO4J_PASSWORD: multimodal_neo4j_123
  #     MINIO_ENDPOINT: minio:9000
  #     MINIO_ACCESS_KEY: minioadmin
  #     MINIO_SECRET_KEY: minioadmin_secure_123
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   networks:
  #     - multimodal-network
  #   restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================

volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
  redis-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  minio-data:
    driver: local
  rabbitmq-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================

networks:
  multimodal-network:
    driver: bridge
