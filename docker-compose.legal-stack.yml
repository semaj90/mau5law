version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres-legal:
    image: pgvector/pgvector:pg16
    container_name: postgres-legal
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_legal_data:/var/lib/postgresql/data
      - ./src/lib/server/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and hot storage
  redis-legal:
    image: redis:7.4-alpine
    container_name: redis-legal
    command: redis-server --requirepass redis --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_legal_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ for async task queuing
  rabbitmq-legal:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-legal
    environment:
      RABBITMQ_DEFAULT_USER: legal_admin
  RABBITMQ_DEFAULT_PASS: 123456
      RABBITMQ_DEFAULT_VHOST: legal_ai
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_legal_data:/var/lib/rabbitmq
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO for object storage (models, documents)
  minio-legal:
    image: minio/minio:latest
    container_name: minio-legal
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: legal_admin
      MINIO_ROOT_PASSWORD: legal_storage_key
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    volumes:
      - minio_legal_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant vector database
  qdrant-legal:
    image: qdrant/qdrant:latest
    container_name: qdrant-legal
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_legal_data:/qdrant/storage
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Legal AI Inference Service with TensorRT-LLM
  legal-ai-inference:
    build:
      context: .
      dockerfile: legal-ai-inference.dockerfile
    container_name: legal-ai-inference
    environment:
      # Service discovery
      POSTGRES_HOST: postgres-legal
      POSTGRES_PORT: 5432
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456

      REDIS_HOST: redis-legal
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis

      RABBITMQ_HOST: rabbitmq-legal
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: legal_admin
      RABBITMQ_PASSWORD: legal123

      MINIO_HOST: minio-legal
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: legal_admin
      MINIO_SECRET_KEY: legal_storage_key

      QDRANT_HOST: qdrant-legal
      QDRANT_PORT: 6333

      # Ollama on host (for TensorRT-LLM integration)
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: 11434

      # GPU settings
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: 0
    ports:
      - "8095:8095"   # Legal AI API
    volumes:
      - ./models:/app/models:ro
      - ./proto:/app/proto:ro
    networks:
      - legal-ai-network
    depends_on:
      postgres-legal:
        condition: service_healthy
      redis-legal:
        condition: service_healthy
      rabbitmq-legal:
        condition: service_healthy
      minio-legal:
        condition: service_healthy
      qdrant-legal:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nginx reverse proxy for the legal AI stack
  nginx-legal:
    image: nginx:alpine
    container_name: nginx-legal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.legal.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - legal-ai-network
    depends_on:
      - legal-ai-inference

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_legal_data:
    driver: local
  redis_legal_data:
    driver: local
  rabbitmq_legal_data:
    driver: local
  minio_legal_data:
    driver: local
  qdrant_legal_data:
    driver: local