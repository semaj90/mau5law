version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: legal_ai_db
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  qdrant:
    image: qdrant/qdrant
    ports:
      - '6333:6333'
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
  triton:
    image: nvcr.io/nvidia/tritonserver:23.04-py3
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8002:8002'
