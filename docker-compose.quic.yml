# Docker Compose for QUIC/HTTP3 Legal AI Platform
# SvelteKit 2 + Caddy + Go Bridge + Dual TensorRT Services
# Optimized for Docker Desktop via WSL2 with RTX 3060 Ti 8GB

version: '3.8'

services:
  # Caddy with QUIC/HTTP3 support
  caddy-quic:
    image: caddy:latest
    container_name: legal-ai-caddy-quic
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "443:443/udp" # QUIC/HTTP3
      - "8080:8080"   # Main app proxy
      - "8090:8090"   # API Gateway
      - "8888:8888"   # Health check
    volumes:
      - ./Caddyfile.quic-simple:/etc/caddy/Caddyfile
      - ./logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_ADMIN=off
    networks:
      - legal-ai-network
    restart: unless-stopped

  # SvelteKit Frontend Instance 1
  sveltekit-1:
    build:
      context: .
      dockerfile: Dockerfile.sveltekit
    container_name: legal-ai-sveltekit-1
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8090
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_PASSWORD=redis
      - REDIS_URL=redis://:redis@redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # SvelteKit Frontend Instance 2 (Load Balanced)
  sveltekit-2:
    build:
      context: .
      dockerfile: Dockerfile.sveltekit
    container_name: legal-ai-sveltekit-2
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8090
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_PASSWORD=redis
      - REDIS_URL=redis://:redis@redis:6379
      - PORT=5174
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Enhanced Go Bridge with QUIC CORS
  tensorrt-bridge:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile.bridge
    container_name: legal-ai-bridge-quic
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - REDIS_PASSWORD=redis
      - REDIS_URL=redis://:redis@redis:6379
      - TENSORRT_LEGAL_URL=http://tensorrt-legal:8090
      - TENSORRT_270M_URL=http://tensorrt-270m:8091
      - OLLAMA_URL=http://ollama:11434
      - GPU_DEVICE=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - legal-ai-network
    depends_on:
      - redis
      - tensorrt-legal
      - tensorrt-270m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # TensorRT Legal Model (7GB VRAM)
  tensorrt-legal:
    image: nvcr.io/nvidia/tensorrt:23.10-py3
    container_name: legal-ai-tensorrt-legal
    ports:
      - "8090:8090"
    environment:
      - MODEL_PATH=/models/gemma3-legal-latest
      - TENSORRT_WORKSPACE_SIZE=7516192768  # 7GB
      - FLASH_ATTENTION=true
      - CUDA_GRAPH=true
      - INT4_QUANTIZATION=true
      - MAX_BATCH_SIZE=4
      - MAX_SEQUENCE_LENGTH=8192
      - GPU_MEMORY_FRACTION=0.875  # 87.5% of 8GB = 7GB
    volumes:
      - ./models:/models
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - legal-ai-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # TensorRT 270M Model (512MB VRAM)
  tensorrt-270m:
    image: nvcr.io/nvidia/tensorrt:23.10-py3
    container_name: legal-ai-tensorrt-270m
    ports:
      - "8091:8091"
    environment:
      - MODEL_PATH=/models/gemma3-270m
      - TENSORRT_WORKSPACE_SIZE=536870912   # 512MB
      - FLASH_ATTENTION=true
      - CUDA_GRAPH=true
      - INT4_QUANTIZATION=true
      - MAX_BATCH_SIZE=8
      - MAX_SEQUENCE_LENGTH=2048
      - GPU_MEMORY_FRACTION=0.0625  # 6.25% of 8GB = 512MB
    volumes:
      - ./models:/models
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - legal-ai-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama Fallback Service
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ai-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/ollama/models
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./ollama/models:/ollama/models
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - legal-ai-network
    restart: unless-stopped

  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-ai-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=123456
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/lib/server/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    restart: unless-stopped

  # Redis with Authentication
  redis:
    image: redis:alpine
    container_name: legal-ai-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-network
    restart: unless-stopped

  # Vector Database (Qdrant) for Advanced Embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-ai-network
    restart: unless-stopped

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data: