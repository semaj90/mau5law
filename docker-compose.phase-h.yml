version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  analytics-bridge:
    build:
      context: ./native/autoencoder
      dockerfile: Dockerfile.bridge
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    # GPU reservation for compose v2+ (ignored by older parsers)
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  behavior-router:
    build:
      context: ./native/autoencoder
      dockerfile: Dockerfile.bridge
    command: ["python", "-u", "behavior_router.py"]
    depends_on:
      - redis
      - analytics-bridge
    environment:
      - REDIS_URL=redis://redis:6379

  qlora-trainer:
    build:
      context: ./native/autoencoder
      dockerfile: Dockerfile.bridge
    command: ["python", "-u", "qlora_trainer_stream.py"]
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  adapter-merge-worker:
    build:
      context: ./native/autoencoder
      dockerfile: Dockerfile.bridge
    command: ["python", "-u", "adapter_merge_worker.py"]
    depends_on:
      - qlora-trainer
      - redis

  cpu-synthesizer:
    image: node:18-slim
    working_dir: /app
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./sveltekit-frontend:/app
    ports:
      - "8101:8101"

  triton:
    image: nvcr.io/nvidia/tritonserver:23.09-py3
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./native/autoencoder/triton_model_repository:/models
    environment:
      - TRITON_MODEL_REPOSITORY=/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: