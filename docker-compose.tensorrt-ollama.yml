# TensorRT-LLM + Ollama Integration Stack
# Knowledge distillation pipeline with <1ms inference

services:
  # TensorRT-LLM Server with Ollama Integration
  tensorrt-llm-server:
    build:
      context: .
      dockerfile: Dockerfile.tensorrt-ollama
    image: tensorrt-llm-ollama:latest
    container_name: tensorrt-llm-legal-ai
    ports:
      - "8100:8100"  # TensorRT-LLM API
    volumes:
      - "./engines:/workspace/engines"
      - "./models:/workspace/models"
      - "./logs:/workspace/logs"
      - "./ollama-models:/workspace/ollama-models"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_HOST=host.docker.internal:11434
      - TRT_LOGGER_LEVEL=WARNING
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - legal-ai-network
    depends_on:
      - ollama-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Ollama Service (if not running on host)
  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-legal-models
    ports:
      - "11434:11434"
    volumes:
      - "ollama-data:/root/.ollama"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching embeddings
  redis-cache:
    image: redis:7-alpine
    container_name: redis-legal-cache
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    networks:
      - legal-ai-network
    restart: unless-stopped

  # PostgreSQL with pgvector for legal document storage
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres-legal-vectors
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=legal_ai
      - POSTGRES_USER=legal_user
      - POSTGRES_PASSWORD=legal_pass_2025
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./sql/init.sql:/docker-entrypoint-initdb.d/init.sql"
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_user -d legal_ai"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16